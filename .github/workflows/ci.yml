name: build-and-test
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build --config ${{ matrix.config }} --parallel
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - run: cmake --install build --config ${{ matrix.config }} --prefix out/install
      - run: cmake -S tests/consumer -B consumer -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/out/install"
      - run: cmake --build consumer --config ${{ matrix.config }} --parallel
      - run: ctest --test-dir consumer -C ${{ matrix.config }} --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
